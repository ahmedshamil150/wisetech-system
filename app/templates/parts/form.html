{% extends "base.html" %}
{% block title %}Add Part | Ultrasound Inventory{% endblock %}
{% block eyebrow %}Quantity-based stock{% endblock %}
{% block heading %}Add Part{% endblock %}
{% block content %}
<section class="panel">
    <form class="form-grid" method="post" action="{{ url_for('main.part_add') }}">
        <div class="form-row">
            <label for="name_model">Part name / model <span class="required">*</span></label>
            <input type="text" id="name_model" name="name_model" maxlength="120" required
                   value="{{ form.get('name_model') or '' }}"
                   placeholder="e.g. PS AVIUS, CB BOARD APLIO 300/400/500">
        </div>

        <div class="form-row">
            <label for="brand_name">Brand</label>
            <input type="text" id="brand_name" name="brand_name" maxlength="60"
                   value="{{ form.get('brand_name') or '' }}"
                   placeholder="e.g. Toshiba, GE, Philips (optional)">
        </div>

        <div class="form-row">
            <label for="quantity">Quantity <span class="required">*</span></label>
            <input type="number" id="quantity" name="quantity" min="0" step="1" required
                   value="{{ form.get('quantity') or '1' }}">
        </div>

        <div class="form-row">
            <label for="serial_number">Serial number</label>
            <input type="text" id="serial_number" name="serial_number" maxlength="80"
                   value="{{ form.get('serial_number') or '' }}"
                   placeholder="Leave blank if not applicable">
        </div>

        <div class="form-row">
            <label for="batch_id">Batch</label>
            <select id="batch_id" name="batch_id">
                <option value="">No batch</option>
                {% for b in batches %}
                    <option value="{{ b.id }}" {% if form.get('batch_id') == b.id|string %}selected{% endif %}>{{ b.code }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-row">
            <label for="acquisition_date">Date received</label>
            <input type="date" id="acquisition_date" name="acquisition_date"
                   value="{{ form.get('acquisition_date') or today }}">
        </div>

        <div class="form-row">
            <label for="condition">Condition</label>
            <select id="condition" name="condition">
                <option value="">—</option>
                {% for c in conditions %}
                    <option value="{{ c }}" {% if form.get('condition') == c %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-row form-row-full">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="4"
                      placeholder="Supplier reference, compatibility, storage location…">{{ form.get('notes') or '' }}</textarea>
        </div>

        <div class="form-actions">
            <a class="btn btn-ghost" href="{{ url_for('main.parts') }}">Cancel</a>
            <button class="btn btn-primary" type="submit">Add Part</button>
        </div>
    </form>
</section>
{% endblock %}
